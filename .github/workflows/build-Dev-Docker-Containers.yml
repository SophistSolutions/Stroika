#
#
#
name: build-Dev-Docker-Containers

on:
  # push:
  workflow_dispatch:
    inputs:
      run_all:
        description: "run all"
        required: false
        default: "true"

jobs:
  LinuxMatrixPrep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - id: set-matrix
      run: |
        branchName=$(echo '${{ github.ref }}' | sed 's,refs/heads/,,g')  
        matrix=$(jq --arg branchName "$branchName" 'map( 
            . | select((.run_on_branch==$branchName) or (.run_on_branch=="always") or ("${{github.event.inputs.run_all}}"=="true") and (.run_on_branch!="never")) | select(.build_job=="Linux")
        )' .github/workflows/build-Dev-Docker-Containers-Matrix.json)                
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT
  WindowsMatrixPrep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - id: set-matrix
      run: |
        branchName=$(echo '${{ github.ref }}' | sed 's,refs/heads/,,g')  
        matrix=$(jq --arg branchName "$branchName" 'map( 
            . | select((.run_on_branch==$branchName) or (.run_on_branch=="always") or ("${{github.event.inputs.run_all}}"=="true")) | select(.build_job=="Windows")
        )' .github/workflows/build-Dev-Docker-Containers-Matrix.json)                
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT
  build-Linux:
    needs: LinuxMatrixPrep
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix: ${{fromJson(needs.LinuxMatrixPrep.outputs.matrix)}}
    env:
      "BUILD_DEV_IMAGES": "0" 
    steps:
      - uses: actions/checkout@v4
      - name: Build System Info
        shell: "bash"
        run: |
          df -h
          uname -a
          echo "DetectedHostOS: `./ScriptsLib/DetectedHostOS`"
      - name: Install Tools
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install dos2unix
      - name: Build Linux Container Images
        run: |
          DEBIAN_FRONTEND=noninteractive make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" build-images
          DEBIAN_FRONTEND=noninteractive make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" tag-images
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push Linux Container Images
        run: |
          DEBIAN_FRONTEND=noninteractive make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" push-images

  build-Windows:
    needs: WindowsMatrixPrep
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix: ${{fromJson(needs.WindowsMatrixPrep.outputs.matrix)}}
    defaults:
      run:
        shell: msys2 {0}
    env:
      USE_DOCKER_ROOT: "D:/docker"
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            make
      - uses: actions/checkout@v4
      - name: Build System Info
        shell: "bash"
        run: |
          df -h
          uname -a
          systeminfo
          echo "DetectedHostOS: `./ScriptsLib/DetectedHostOS`"
          echo NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS
          # Was running out of space, and doesn't seem to be commandline way to set storage opts, so
          # add --storage-opts ["size=60GB"] or some such, to this file, and see if it works better, but not needed for now --LGP 2024-02-26
          echo "C:/ProgramData/Docker/config/daemon.json:" -n ; cat "C:/ProgramData/Docker/config/daemon.json"
      - name: Setup Docker to use ${{env.USE_DOCKER_ROOT}} as data-root
        shell: powershell
        run: |
          mkdir D:\docker
          $configFile = "C:\ProgramData\Docker\config\daemon.json"
          $dockerRootDir = "D:\\docker"
          # Ensure the config file exists
          if (-not (Test-Path $configFile)) {
            New-Item $configFile -ItemType File
            $config = @{}
          } else {
            $config = Get-Content $configFile | ConvertFrom-Json
          }
          # Add or update the 'data-root' property using Add-Member
          # -Force allows updating the property if it already exists
          $config | Add-Member -MemberType NoteProperty -Name "data-root" -Value $dockerRootDir -Force
          # Write the updated config back to the file
          $config | ConvertTo-Json -Depth 4 | Set-Content $configFile
          # Print to verify updated properly
          Get-Content -Path C:\ProgramData\Docker\config\daemon.json
      - name: Restart Docker service to apply changes
        shell: powershell
        run: |
          Stop-Service Docker
          Start-Service Docker
      - name: Verify the new Docker Root Dir
        shell: powershell
        run: |
          docker info | Select-String "Docker Root Dir"
          docker info --format '{{.DockerRootDir}}'
          docker system df -v
          docker info
      - name: Free up disk space
        shell: "cmd"
        run: |
          del /F /Q %TEMP%\*
          rd /S /Q %TEMP%
          docker system prune -af
      - name: Build Windows Container Images (sophistsolutionsinc/stroika-buildvm-windows-vs2k22)
        # Done as separate step since takes so long, and can see the time for this step more clearly... (could be omitted)
        run: |
          # just to avoid running out of space add WINDOWS_BASE_IMAGE ltsc2022
          make --directory DockerBuildContainers --no-print-directory WINDOWS_BASE_IMAGE=mcr.microsoft.com/windows/servercore:ltsc2022 sophistsolutionsinc/stroika-buildvm-windows-vs2k22
      - name: "Build Windows Container Images (${{ matrix.container_images }})"
        run: |
          make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" WINDOWS_BASE_IMAGE=mcr.microsoft.com/windows/servercore:ltsc2022 build-images
      - name: Tag Windows Container Images
        run: |
          make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" tag-images
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Push Windows Container Images
        run: |
          make --directory DockerBuildContainers --no-print-directory IMAGES="${{ matrix.container_images }}" push-images
