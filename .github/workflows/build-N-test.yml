#
# Docs on github action files: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
# build-N-test
#

name: build-N-test

on:
  push:
  workflow_dispatch:
    inputs:
      run_all:
        description: "run all"
        required: false
        default: "true"
      container_version:
        description: "Container Version"
        required: false
        default: "v3"
      deploy_doxygen:
        description: "deploy_doxygen"
        required: false
        default: "false"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

#   There is deliberately no `concurrency:` group with cancel-in-progress here. Considered and
#   declined 2026-09-22.
#
#   The case for it: a run fans out to 16 jobs, so two overlapping runs contend for the account's
#   concurrent-job allowance, and jobs then queue. Measured 2026-09-22 - 26 to 44 minutes of queue
#   wait per job while runs overlapped, versus 0.1 min for a run that had the place to itself. Pushes
#   routinely land 2-5 minutes apart against runs that take 86-152 minutes, so this is the normal
#   case, not an edge one.
#
#   Why not, anyway: cancelling superseded runs would throw away the per-commit red/green history.
#   Push five changes and have the second break something, and it is precisely which run turns red
#   that tells you which commit did it. For the compilers and platforms no single dev box has - which
#   is most of this matrix, and the reason CI exists here - that history is the only bisect data there
#   is. Faster answers about the tip are not worth losing the ability to attribute a failure.
#

jobs:
  LinuxMatrixPrep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - id: set-matrix
      run: |
        branchName=$(echo '${{ github.ref }}' | sed 's,refs/heads/,,g')  
        matrix=$(jq --arg branchName "$branchName" 'map( 
            . | select((.run_on_branch==$branchName) or (.run_on_branch=="always") or ("${{github.event.inputs.run_all}}"=="true") and (.run_on_branch!="never")) | select(.build_job=="Linux")
        )' .github/workflows/build-N-test-Matrix.json)                
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT
  MacOSMatrixPrep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - id: set-matrix
      run: |
        branchName=$(echo '${{ github.ref }}' | sed 's,refs/heads/,,g')  
        matrix=$(jq --arg branchName "$branchName" 'map( 
            . | select((.run_on_branch==$branchName) or (.run_on_branch=="always") or ("${{github.event.inputs.run_all}}"=="true") and (.run_on_branch!="never")) | select(.build_job=="MacOS")
        )' .github/workflows/build-N-test-Matrix.json)                
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT
  WindowsMatrixPrep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - id: set-matrix
      run: |
        branchName=$(echo '${{ github.ref }}' | sed 's,refs/heads/,,g')  
        matrix=$(jq --arg branchName "$branchName" 'map( 
            . | select((.run_on_branch==$branchName) or (.run_on_branch=="always") or ("${{github.event.inputs.run_all}}"=="true") and (.run_on_branch!="never")) | select(.build_job=="Windows")
        )' .github/workflows/build-N-test-Matrix.json)                
        echo "matrix={\"include\":$(echo $matrix)}" >> $GITHUB_OUTPUT

  Linux:
    needs: LinuxMatrixPrep
    runs-on: ${{ matrix.runs_on }}
    #   GitHub's only bound otherwise is 6h/job, which is how a wedged run reached 30h (2026-08).
    #   A hung run is never superseded, so it just sits holding runner slots. Longest legitimate
    #   job measured is ~135min, so this is ~1.8x headroom. @see issue 1169 for one live cause.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.LinuxMatrixPrep.outputs.matrix)}}
    env:
      # (HISTORICAL): vm has 2 virtual CPUs, but 8GB ram, so jobs=3 (empirical), and QUICK_BUILD avoids some internal testing
      # vm has 4 virtual CPUs, but 16GB ram, so jobs=4 (empirical. tried 5 and 6 with no significant improvement), and QUICK_BUILD avoids some internal testing --LGP 2025-02-07
      MAKEFLAGS: "--jobs=4 QUICK_BUILD=1"
      ARTIFACTS_DIR: "/tmp/Artifacts/"
      ARTIFACTS_DIR_BUILDLOGS: "${ARTIFACTS_DIR}/BUILD_LOGS/"
    container: ${{ matrix.container_image }}:${{github.event.inputs.container_version || 'v3'}}
    steps:
      - uses: actions/checkout@v7
      - name: Build System Info (container version ${{github.event.inputs.container_version || 'v3'}})
        run: |
          lsb_release -d 2>/dev/null || true
          echo "CWD=" `pwd`
          echo "hw.ncpu=" $(sysctl -n hw.ncpu)
          echo "hw.memsize=" $(sysctl -n hw.memsize)
          grep "model name" /proc/cpuinfo | head -1
          grep processor /proc/cpuinfo | wc -l
          grep MemTotal /proc/meminfo
          df -h
      # GitHub's ubuntu-latest runners do not all have the same disk. On 2026-11-05 a Release job failed - "No space left on device",
      # archiving libstroika-frameworks.a (run 41957252631) - on a runner with a 72G disk, 5.5G free at the start; the same job on a
      # 145G runner (75G free) passed, using about 8G. Removing packages in this container ("Save space (Before Start of Builds)")
      # frees nothing on the runner's disk: the image's layers keep them. But the runner's tool cache - /opt/hostedtoolcache: CodeQL,
      # Go, Python, Java ... - is mounted here at /__t, on that same disk, and nothing in this job used it (2026-11): actions run their
      # node from /__e, and a setup-* action fetches its tool if missing. Each job gets a fresh runner VM, so this deletes only this
      # job's copy - codeql-analyze, doxygen etc. have their own. So if a later step of THIS job goes missing a tool, or gets slow
      # fetching one, look here first. The du says how much this frees.
      - name: Save space (the runner's tool cache)
        shell: "bash"
        run: |
          df -h /__t
          du -sh /__t || true
          rm -rf /__t/* || true
          df -h /__t
      - name: Due to insufficient disk space error on ubuntu-latest github actions, use smaller initial base container and add stuff needed
        shell: "bash"
        if: matrix.extra_apt_add_packages != null
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_ADD_PACKAGES: ${{ join(matrix.extra_apt_add_packages, ' ') }}
        run: |
            echo "extra_apt_add_packages=\"${APT_ADD_PACKAGES}\""
            for package in $APT_ADD_PACKAGES; do
              echo "apt-get install -qq -y $package"
              apt-get install -qq -y "$package"
            done
            apt-get autoremove -qq -y || true
            apt-get clean -qq -y || true
      - name: Save space (Before Start of Builds)
        shell: "bash"
        if: always()
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_REMOVE_PACKAGES: ${{ join(matrix.extra_apt_remove_packages, ' ') }}
        run: |
          echo "Before cleanup:" ; df -h
          df
          apt-get remove -y clang-*-doc clang-*-examples || true
          apt-get remove -y manpages* || true
          apt-get autoremove -y || true
          apt-get clean || true
          npm cache clean --force || true
          rm -rf Archive License.txt

          # Keep this hack around in case I discover a way to make it work, but for now it doesn't due to how layers work in docker images --LGP 2025-12-12
          echo "extra_apt_remove_packages=\"${APT_REMOVE_PACKAGES}\""
          if [[ -z "$APT_REMOVE_PACKAGES" ]] ; then
            echo "matrix.extra_apt_remove_packages is empty."
          else
            for package in $APT_REMOVE_PACKAGES; do
              echo "apt-get remove -y $package"
              apt-get remove -y "$package" || true
            done
            apt-get autoremove -y || true
          fi

          echo "After cleanup:" ; df -h
      # Conan's cache (Building-Stroika.md, "Conan's cache") from this job's last run, so the third-party components it built
      # are not built again - kept in the checkout (.conan-home), where both the steps (in the container) and the cache
      # actions find it: saved under a key for the packages it holds, after third-party-components, and restored from this
      # job's newest.
      - name: Restore Conan's cache
        uses: actions/cache/restore@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-${{ github.sha }}
          restore-keys: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-
      - name: Conan's cache, in the checkout
        run: |
          echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan-home" >> "$GITHUB_ENV"
      - name: Configure ${{ matrix.config_name }}
        run: |
          Build/Scripts/MakeBuildRoot
          ./configure ${{ matrix.config_name }} --compiler-driver ${{ matrix.compiler }} ${{ matrix.extra_config_args }} --cppstd-version ${{ matrix.cpp_version }}
          cat IntermediateFiles/ConfigurationFiles/${{ matrix.config_name }}.xml
      # Break out third-party-components to do clean so we dont run out of disk space, and break out TPC AND library
      # to show the summary time for each part
      - name: Make third-party-components
        run: |
          make third-party-components
      # its packages, not their build and source folders; a run that built none saves nothing (its key is there already)
      - name: Conan's cache, to save
        run: |
          conan cache clean "*" --source --build --temp
      - name: Save Conan's cache
        uses: actions/cache/save@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-${{ hashFiles('.conan-home/p/**/conaninfo.txt') }}
      - name: Copy Build Artifacts (third-party-components Log Data etc)
        if: always()
        run: |
          # each component's step logs - its configure, build and install (CMake's ExternalProject: in its stamp directory)
          for stamp in IntermediateFiles/${{ matrix.config_name }}/CMake/ThirdParty/*/stamp; do
            [ -d "$stamp" ] || continue
            component="$(basename "$(dirname "$stamp")")"
            mkdir -p "${ARTIFACTS_DIR_BUILDLOGS}/ThirdPartyComponents/$component"
            cp "$stamp"/*.log "${ARTIFACTS_DIR_BUILDLOGS}/ThirdPartyComponents/$component/" 2>/dev/null || :
          done
      - name: Save space (Safe)
        if: always()
        run: |
          # the components' sources and build trees (make clean keeps what they installed)
          make clean
          echo "After cleanup:" ; df -h
      - name: Make libraries and tools
        run: |
          make libraries tools
      - name: Save space
        if: always()
        run: |
          echo "*************Before save space*************:"
          df -h
          du -hs Builds/*/* IntermediateFiles/*/* ThirdPartyComponents/Origs-Cache/
          # (not Stroika's objects: without them, CMake builds the libraries again for the tests)
          rm -f ThirdPartyComponents/Origs-Cache/*
          echo ""*************After cleanups"*************:"
          df -h
          du -hs Builds/*/* IntermediateFiles/*/* ThirdPartyComponents/*
      - name: Run Tests
        env:
          # UBSan reports and carries on by default - into a log nobody reads, the job green; halting fails the test (ASan
          # halts already). Local release runs need not: their summary counts each 'runtime error:' line
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          make run-tests
      - name: Save space
        if: always()
        run: |
          echo "*************Before save space*************:"
          df -h
          du -hs Builds/*/* IntermediateFiles/*/*
          # the test programs, run (the samples need none of them)
          rm -rf Builds/${{ matrix.config_name }}/Tests
          echo ""*************After cleanups"*************:"
          df -h
      - name: Make samples
        run: |
          make samples
      # Stroika installed, as a package manager installs it; then a new Skel application built on Stroika's package, which
      # nothing else here reads - the build's, then the installation's
      - name: Make install
        run: |
          make install CONFIGURATION=${{ matrix.config_name }} PREFIX="${RUNNER_TEMP:-/tmp}/Stroika-Installed"
      - name: Make skel-test
        run: |
          make skel-test
          make skel-test CONFIGURATION=${{ matrix.config_name }} PREFIX="${RUNNER_TEMP:-/tmp}/Stroika-Installed"
      - name: Build System Info
        run: |
          df -h
      - name: Copy Build Artifacts (Samples Log Data etc)
        if: always()
        run: |
          mkdir -p ${ARTIFACTS_DIR_BUILDLOGS}
          mkdir -p \
            "${ARTIFACTS_DIR_BUILDLOGS}/Samples-HTMLUI/html/"
          # NOTE - some of these copies may fail, if the item is not present, but not a problem (like if we dont build libxml2 the log files wont be there)
          cp IntermediateFiles/"${{ matrix.config_name }}"/CMake/HTMLUI-html/*.txt "${ARTIFACTS_DIR_BUILDLOGS}/Samples-HTMLUI/html/" || :
      - name: Archive Samples Results
        uses: actions/upload-artifact@v7
        with:
          name: Sample apps (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            Builds/${{ matrix.config_name }}/*Samples-*
      - name: Archive Log Data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Log Data (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            ${{ env.ARTIFACTS_DIR }}PerformanceDump.txt
            ${{ env.ARTIFACTS_DIR_BUILDLOGS }}
            /tmp/Trace*.txt
      - name: Archive Core-Dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CoreDumps (${{ matrix.displayTargetName }})
          if-no-files-found: ignore
          path: |
            *core*
  
  MacOS:
    needs: MacOSMatrixPrep
    runs-on: ${{ matrix.runs_on }}
    #   GitHub's only bound otherwise is 6h/job, which is how a wedged run reached 30h (2026-08).
    #   A hung run is never superseded, so it just sits holding runner slots. Longest legitimate
    #   job measured is ~135min, so this is ~1.8x headroom. @see issue 1169 for one live cause.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.MacOSMatrixPrep.outputs.matrix)}}
    env:
      # vm has 3 virtual CPUs, but 8GB ram, so jobs=3 (empirical), and QUICK_BUILD avoids some internal testing --LGP 2025-05-08
      MAKEFLAGS: "--jobs=3 QUICK_BUILD=1"
      # Workaround for LIBIDB2 not found https://github.com/actions/runner-images/issues/9638
      LIBRARY_PATH: "/opt/homebrew/lib"
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - uses: actions/checkout@v7
      - name: Build System Info
        run: |
          echo "CWD: `pwd`"
          df -h
          system_profiler SPSoftwareDataType
          system_profiler SPDeveloperToolsDataType
          sw_vers
          echo "    XCode: `xcodebuild -version | tr '\n' ';'`"
          echo "LIBRARY_PATH = $LIBRARY_PATH"
          echo "hw.ncpu=" $(sysctl -n hw.ncpu)
          echo "hw.memsize=" $(sysctl -n hw.memsize)
      # If we had docker ability, most of these would be built into a docker file
      - name: Install Basic Build requirements
        run: |
          brew install -q gnu-sed
          brew install -q p7zip
          brew install -q autoconf
          brew install -q libtool
          brew install -q automake
          brew install -q conan
          Build/Scripts/MakeBuildRoot
          make install-realpath
      # as for Linux: Conan's cache from this job's last run, in the checkout
      - name: Restore Conan's cache
        uses: actions/cache/restore@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.runs_on }}-${{ matrix.config_name }}-${{ github.sha }}
          restore-keys: conan-${{ matrix.runs_on }}-${{ matrix.config_name }}-
      - name: Conan's cache, in the checkout
        run: |
          echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan-home" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          ./configure ${{ matrix.config_name }} ${{ matrix.extra_config_args }}
          cat IntermediateFiles/ConfigurationFiles/${{ matrix.config_name }}.xml
      - name: Build third-party-components
        run: |
          make third-party-components
          make clean
      - name: Conan's cache, to save
        run: |
          conan cache clean "*" --source --build --temp
      - name: Save Conan's cache
        uses: actions/cache/save@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.runs_on }}-${{ matrix.config_name }}-${{ hashFiles('.conan-home/p/**/conaninfo.txt') }}
      - name: Build Library and Tools
        run: |
          make libraries tools
      - name: Build Samples
        run: |
            make samples
      - name: Build Tests
        run: |
          make tests
      - name: Run-Tests
        env:
          # as for Linux: a UBSan finding fails the test, rather than printing into a green log
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          make run-tests
      # as for Linux: Stroika installed, and a Skel application built on the build's package, then the installation's
      - name: Make install
        run: |
          make install CONFIGURATION=${{ matrix.config_name }} PREFIX="${RUNNER_TEMP:-/tmp}/Stroika-Installed"
      - name: Make skel-test
        run: |
          make skel-test
          make skel-test CONFIGURATION=${{ matrix.config_name }} PREFIX="${RUNNER_TEMP:-/tmp}/Stroika-Installed"
      - name: Workaround GitHub-Actions-MacOS Issue with env.TMPDIR
        if: always()
        run: |
          mkdir /tmp/LOGS-ARCHIVE
          cp $TMPDIR/Trace*.txt /tmp/LOGS-ARCHIVE || :
      - name: Build System Info
        run: |
          df -h
      - name: Archive Log Data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Log Data (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            Builds/${{ matrix.config_name }}/PerformanceDump.txt
            /tmp/LOGS-ARCHIVE
            IntermediateFiles/${{ matrix.config_name }}/CMake/Samples/**/*-Installer-Build-Output.txt
            IntermediateFiles/${{ matrix.config_name }}/CMake/ThirdParty/*/stamp/*.log
      - name: Archive Sample Results
        uses: actions/upload-artifact@v7
        with:
          name: Sample apps (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            Builds/${{ matrix.config_name }}/Samples-*

  Windows:
    needs: WindowsMatrixPrep
    runs-on: ${{ matrix.runs_on }}
    #   GitHub's only bound otherwise is 6h/job, which is how a wedged run reached 30h (2026-08).
    #   A hung run is never superseded, so it just sits holding runner slots. Longest legitimate
    #   job measured is ~135min, so this is ~1.8x headroom. @see issue 1169 for one live cause.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.WindowsMatrixPrep.outputs.matrix)}}
    env:
      # see docker run for --cpus and --memory, and adjust --jobs accodingly (last done 2025-02-07), and QUICK_BUILD avoids some internal testing
      MAKEFLAGS: "--jobs=4 QUICK_BUILD=1"
      ARTIFACTS_DIR: "c:/Artifacts/"
      USE_DOCKER_ROOT: "D:/docker"
    steps:
      - uses: actions/checkout@v7
      - name: Build System Info (container version ${{github.event.inputs.container_version || 'v3'}})
        shell: "bash"
        run: |
          echo "CWD: `pwd`"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          df -h
          systeminfo
          echo NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS
          echo "C:/ProgramData/Docker/config/daemon.json:" -n ; cat "C:/ProgramData/Docker/config/daemon.json"
      - name: Setup Docker to use ${{env.USE_DOCKER_ROOT}} as data-root
        shell: powershell
        run: |
          mkdir ${{env.USE_DOCKER_ROOT}}
          $configFile = "C:\ProgramData\Docker\config\daemon.json"
          # Ensure the config file exists
          if (-not (Test-Path $configFile)) {
            New-Item $configFile -ItemType File
            $config = @{}
          } else {
            $config = Get-Content $configFile | ConvertFrom-Json
          }
          # Add or update the 'data-root' property using Add-Member
          # -Force allows updating the property if it already exists
          $config | Add-Member -MemberType NoteProperty -Name "data-root" -Value "${{env.USE_DOCKER_ROOT}}" -Force
          # Write the updated config back to the file
          $config | ConvertTo-Json -Depth 4 | Set-Content $configFile
          # Print to verify updated properly
          Get-Content -Path $configFile
          # Restart Docker to apply changes
          echo "Restarting Docker Service..."
          Stop-Service Docker
          Start-Service Docker
          # Verify the new Docker Root Dir
          echo "docker info:"
          # docker info | Select-String "Docker Root Dir"
          echo "docker info:"
          docker info
          
      # No actual need todo this step (would be done implicitly/automatically) - but do to track how long the step takes (13min)
      - name: docker pull ${{ matrix.container_image }}:${{github.event.inputs.container_version || 'v3'}}
        run: docker pull ${{ matrix.container_image }}:${{github.event.inputs.container_version || 'v3'}}
      # as for Linux: Conan's cache from this job's last run, in the checkout - which the build container mounts, and is
      # given as its CONAN_HOME
      - name: Restore Conan's cache
        uses: actions/cache/restore@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-${{ github.sha }}
          restore-keys: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-
      - name: Start docker build environment
        shell: "bash"
        # docker run --interactive --memory 7G --cpus 2 --storage-opt 'size=50GB' -v "${GITHUB_WORKSPACE}:c:\Stroika" --detach --name buildContainer ${{ matrix.container_image }}:${{github.event.inputs.container_version || 'v3'}} ash -c "c:/msys64/usr/bin/rebaseall -v; exec bash"
        # was running out of memory with 7GB docker container (doing build of help) - and appears running on 16G vm, 4 log cpus, and 147G space, so up mem# /disk (from 50GB) also appears host as 4 vir cpus, so up # cpus from 2 to 4-- LGP 2025-02-07
        run: |
          docker run --interactive --memory 15G --cpus 4 --storage-opt 'size=120GB' \
            -v "${GITHUB_WORKSPACE}:c:\Stroika" --env CONAN_HOME=c:/Stroika/.conan-home --detach --name buildContainer \
            ${{ matrix.container_image }}:${{github.event.inputs.container_version || 'v3'}} bash
      - name: Print Info about docker system
        shell: "bash"
        run: |
          docker ps -a
          docker exec buildContainer systeminfo
          docker exec buildContainer echo NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS
          docker exec buildContainer df -h
      - name: Configure
        shell: "bash"
        run: |
          docker exec --workdir c:/Stroika buildContainer sh -c "Build/Scripts/MakeBuildRoot && ./configure ${{ matrix.config_name }} ${{ matrix.extra_config_args }}"
          docker exec --workdir c:/Stroika buildContainer cat IntermediateFiles/ConfigurationFiles/${{ matrix.config_name }}.xml
      #   Each step's timeout-minutes ends a hung step (no output, make never returns) well before the job's: 2x the longest
      #   legitimate step (59 min, Build Library and Tools - Oct/Nov 2026, ~800 jobs).
      - name: Build Library and Tools
        shell: "bash"
        timeout-minutes: 120
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make libraries tools
      # the third-party components were built with the libraries
      - name: Conan's cache, to save
        shell: "bash"
        run: |
          docker exec buildContainer conan cache clean "*" --source --build --temp
      - name: Save Conan's cache
        uses: actions/cache/save@v6
        with:
          path: .conan-home
          key: conan-${{ matrix.container_image }}-${{ matrix.config_name }}-${{ hashFiles('.conan-home/p/**/conaninfo.txt') }}
      - name: Build Samples
        shell: "bash"
        timeout-minutes: 120
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make samples
      - name: Build Tests
        shell: "bash"
        timeout-minutes: 120
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make tests
      - name: Run-Tests
        shell: "bash"
        timeout-minutes: 120
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make run-tests
      # as for Linux: Stroika installed (in the build container), and a Skel application built on the build's package, then
      # the installation's
      - name: Make install
        shell: "bash"
        timeout-minutes: 60
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make install CONFIGURATION=${{ matrix.config_name }} PREFIX=c:/Stroika-Installed
      - name: Make skel-test
        shell: "bash"
        timeout-minutes: 60
        run: |
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make skel-test
          docker exec --workdir c:/Stroika --env MAKEFLAGS="$MAKEFLAGS" buildContainer make skel-test CONFIGURATION=${{ matrix.config_name }} PREFIX=c:/Stroika-Installed
      #   What a hang leaves behind: a timed-out (or cancelled) step kills only the docker exec client, so the processes it
      #   started are still in the container to be listed - which program each one is, its parent, and its CPU time (a wait
      #   or a spin). Hangs are rare and cannot be reproduced afterwards, so this stays: the first one must already be
      #   caught. Costs seconds, and only in a job that failed.
      #   MSYS_NO_PATHCONV: Git Bash would otherwise turn an argument starting with / into a path.
      - name: List the build container's processes (failed or cancelled job)
        if: failure() || cancelled()
        shell: "bash"
        run: |
          docker exec buildContainer ps -ef || :
          MSYS_NO_PATHCONV=1 docker exec buildContainer powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Sort-Object ParentProcessId | Format-List ProcessId,ParentProcessId,UserModeTime,KernelModeTime,CommandLine' || :
      - name: Build System Info
        shell: "bash"
        run: |
          df -h
          docker exec buildContainer df -h
      - name: Copy Build Artifacts (Log Data and Sample apps etc)
        shell: "bash"
        if: always()
        run: |
          # Because of bind mount, no longer copy out of container, already built in outside filesystem
          # (except $TMPDIR: Just copy out from container the stuff in /tmp)
          NORMALIZED_WORKSPACE_DIR_=`cygpath --mixed "${GITHUB_WORKSPACE}"`
          # echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}"
          # echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "NORMALIZED_WORKSPACE_DIR_=${NORMALIZED_WORKSPACE_DIR_}"
          mkdir -p $ARTIFACTS_DIR
          (docker exec --workdir c:/ buildContainer bash -c 'mkdir -p c:/TRACE_LOGS; cp $TEMP/Trace*.txt c:/TRACE_LOGS/') || :
          # due to flaws in docker (windows must stop) - and docker cp doesn't support wildcards
          docker stop buildContainer
          (docker cp "buildContainer:c:/TRACE_LOGS" "${ARTIFACTS_DIR}") || echo "error copying tracelogs ignored"
          (cp -r --dereference "${NORMALIZED_WORKSPACE_DIR_}/Builds/${{ matrix.config_name }}/"Samples-* "${ARTIFACTS_DIR}") || echo "Error copying builds ignored"
          #PDB files are big - no need to save if I want to debug, will do from source/rebuild
          rm -rf "${ARTIFACTS_DIR}/"{ThirdPartyComponents,Tests,*.lib} "${ARTIFACTS_DIR}/"*/*.{pdb,wixpdb}
          COPY_FROM_ROOT_="${NORMALIZED_WORKSPACE_DIR_}/IntermediateFiles/${{ matrix.config_name }}/"
          COPY_TO_ROOT_="${ARTIFACTS_DIR}/BUILD_LOGS/"
          mkdir -p "${COPY_TO_ROOT_}/Samples-HTMLUI/html/"
          cp "${COPY_FROM_ROOT_}/CMake/HTMLUI-html/NPM-Install.txt" "${COPY_TO_ROOT_}/Samples-HTMLUI/html/" || :
          cp "${COPY_FROM_ROOT_}/CMake/HTMLUI-html/Build.txt" "${COPY_TO_ROOT_}/Samples-HTMLUI/html/" || :
          cp "${COPY_FROM_ROOT_}/CMake/Samples/HTMLUI/WIX-Installer-Build-Output.txt" "${COPY_TO_ROOT_}/Samples-HTMLUI/" || :
          # each component's step logs - its configure, build and install (CMake's ExternalProject: in its stamp directory)
          for stamp in "${COPY_FROM_ROOT_}"/CMake/ThirdParty/*/stamp; do
            [ -d "$stamp" ] || continue
            component="$(basename "$(dirname "$stamp")")"
            mkdir -p "${COPY_TO_ROOT_}/ThirdPartyComponents/$component"
            cp "$stamp"/*.log "${COPY_TO_ROOT_}/ThirdPartyComponents/$component/" 2>/dev/null || :
          done
      - name: Archive Log Data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Log Data (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            ${{ env.ARTIFACTS_DIR }}PerformanceDump.txt
            ${{ env.ARTIFACTS_DIR }}BUILD_LOGS
            ${{ env.ARTIFACTS_DIR }}TRACE_LOGS
      - name: Archive Sample Results
        uses: actions/upload-artifact@v7
        with:
          name: Sample apps (${{ matrix.displayTargetName }})
          if-no-files-found: warn
          path: |
            ${{ env.ARTIFACTS_DIR }}Samples-*

  codeql-analyze:
    name: codeql-analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed
    env:
      # QUICK_BUILD avoids some internal testing
      MAKEFLAGS: "--jobs=4 QUICK_BUILD=1"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install tools required to build Stroika
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libtool-bin pkg-config cmake automake autoconf libtool-bin
        sudo apt-get install -y g++
        # Conan, which builds the third-party components: its own .deb, as Ubuntu has no Conan 2 package (the version the
        # Ubuntu*-Small Dockerfiles install)
        wget -q https://github.com/conan-io/conan/releases/download/2.34.0/conan-2.34.0-amd64.deb -O /tmp/conan.deb
        sudo apt-get install -y /tmp/conan.deb
    - name: Configure
      # NOTE - disable optimizer due bugs/errors in optimizer (link errors) - but no matter, cuz also slows down analysis (I think)
      # --debug-symbols false to save space and cuz no need
      run: |
        Build/Scripts/MakeBuildRoot
        ./configure Release --compiler-driver g++ --apply-default-release-flags --lto disable --append-CXXFLAGS -O0 --debug-symbols false
        cat IntermediateFiles/ConfigurationFiles/Release.xml
    # Break out third-party-components to do clean so we dont run out of disk space, and break out TPC AND library
    # to show the summary time for each part
    - name: Make third-party-components
      run: |
        make third-party-components
        make clean
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main
    - name: Make Stroika
      run: make all
    - name: Archive Log Data
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Log Data (codeql-analyze)
        if-no-files-found: warn
        path: |
          IntermediateFiles/Release/CMake/Samples/**/*-Installer-Build-Output.txt
          IntermediateFiles/Release/CMake/ThirdParty/curl/stamp/*.log
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  doxygen:
    runs-on: ubuntu-latest
    container: sophistsolutionsinc/stroika-buildvm-ubuntu2404-regression-tests
    steps:
      - uses: actions/checkout@v7
      - name: Build System Info (container version ${{github.event.inputs.container_version || 'v3'}})
        run: |
          lsb_release -d 2>/dev/null || true
          echo "CWD=" `pwd`
          echo "hw.ncpu=" $(sysctl -n hw.ncpu)
          echo "hw.memsize=" $(sysctl -n hw.memsize)
          grep "model name" /proc/cpuinfo | head -1
          grep processor /proc/cpuinfo | wc -l
          grep MemTotal /proc/meminfo
          df -h
      - name: Make Documentation
        run: |
          Build/Scripts/MakeBuildRoot
          make documentation
          (cd Builds; tar xvf Stroika-Doxygen-Help.tar.gz)
      - name: Archive Documentation Results
        uses: actions/upload-artifact@v7
        # https://github.com/actions/upload-artifact/issues/506 include matrix configname until bug fixed --LGP 2024-11-27
        continue-on-error: true
        with:
          name: Stroika-Doxygen-Help
          path: |
            Builds/Stroika-Doxygen-Help
      - name: Archive Log Data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Log Data (doxygen)
          if-no-files-found: warn
          path: |
            IntermediateFiles/Doxygen/BUILD.txt

  # Single deploy job since we're just deploying help to github pages
  deploy-doxygen:
    needs: doxygen
    if: github.event.inputs.deploy_doxygen == 'true' || github.ref == 'refs/heads/v3-Release' 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container: sophistsolutionsinc/stroika-buildvm-ubuntu2404-regression-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Make Documentation (since I dont know how to copy result from other step - this is simpler)
        run: |
          Build/Scripts/MakeBuildRoot
          make documentation
          (cd Builds; tar xvf Stroika-Doxygen-Help.tar.gz)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Builds/Stroika-Doxygen-Help'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4